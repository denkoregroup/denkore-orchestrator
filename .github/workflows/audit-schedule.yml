name: Audit schedule

# Audits every registered site once a day and posts each report to the app, so /sites
# is fresh without anyone typing a command. Run it by hand from the Actions tab too.
# Scheduled workflows only run from the default branch. GitHub can delay or skip
# scheduled runs when it is busy; the app's missed-run watchdog marks a site Overdue
# when its newest report is more than two days old.
#
# Needs: the repository variable AUDIT_REPORT_URL and the secret STEP_WEBHOOK_SECRET.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# Nothing by default. The one job below gets only what checkout needs.
permissions: {}

concurrency:
  group: audit-schedule
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The repository is private: checkout needs read access, nothing more.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exits non-zero if any site failed or was unreachable, so the run shows red.
      - name: Audit every registered site
        run: pnpm audit:schedule
        env:
          AUDIT_REPORT_URL: ${{ vars.AUDIT_REPORT_URL }}
          STEP_WEBHOOK_SECRET: ${{ secrets.STEP_WEBHOOK_SECRET }}
