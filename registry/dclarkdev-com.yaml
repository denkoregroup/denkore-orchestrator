# v1 registered site. Confirmed: the id, the audits url. Best guesses, to check before the
# Conductor builds anything here: repo, hosting and stack. Not an example: the daily audit
# (.github/workflows/audit-schedule.yml) audits every entry with an audits block.
id: dclarkdev-com
repo: denkoregroup/dclarkdev
gateTier: app
hosting:
  provider: aws
stack:
  - html
design:
  system: denkore-base
integrations: []
phase: maintain
tracker:
  provider: github
  project: denkoregroup/dclarkdev
backlog: docs/backlog.md
constraints:
  - Mobile-first; every flow must work at 360px width.
gates:
  oneTap:
    - spec
    - design
  prReview:
    - release
criticalFlowsPath: tests/critical-flows
audits:
  url: https://dclarkdev.com
